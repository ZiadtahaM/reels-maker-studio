name: Reels Maker Studio Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-media-pipeline:
    name: Media Rendering Pipeline & Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Pipeline Invariant Tests
        run: node --test test/reelsmaker.invariants.test.mjs

      - name: Verify Ubiquitous Language Contract
        run: |
          test -f UBIQUITOUS_LANGUAGE.md
          grep -q "ReelGenerationJob" UBIQUITOUS_LANGUAGE.md
          grep -q "VerseRange" UBIQUITOUS_LANGUAGE.md
